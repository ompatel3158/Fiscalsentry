<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <rect width="1400" height="1000" fill="#F4F5F7"/>

  <text x="700" y="42" text-anchor="middle" font-size="12" letter-spacing="3" fill="#9AA5B1" font-weight="700">VISUAL IDENTITY — SYMMETRY MARK</text>

  <!-- Hero icon -->
  <g transform="translate(700,205)">
    <path d="M0,-115 L-80,-65 L-80,25 L0,115 Z" fill="#0E2A47"/>
    <path d="M0,-115 L80,-65 L80,25 L0,115 Z" fill="#14C9B7"/>
    <circle cx="0" cy="0" r="34" fill="#FFFFFF" stroke="#0E2A47" stroke-width="2"/>
    <path d="M0,-14 L14,0 L0,14 L-14,0 Z" fill="#D9A441"/>
    <line x1="0" y1="-115" x2="0" y2="115" stroke="#0E2A47" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.35"/>
  </g>

  <!-- Wordmark -->
  <text x="700" y="410" text-anchor="middle" font-size="62" font-weight="700" letter-spacing="1.5"><tspan fill="#0E2A47">FISCAL</tspan><tspan fill="#14C9B7">SENTRY</tspan></text>
  <text x="700" y="448" text-anchor="middle" font-size="14" letter-spacing="4" fill="#6B7684" font-weight="600">AUTONOMOUS FINANCIAL &amp; PAPERWORK ACTION ENGINE</text>

  <line x1="200" y1="500" x2="1200" y2="500" stroke="#D8DCE1" stroke-width="1.5"/>

  <!-- Card 1: On light -->
  <rect x="80" y="540" width="280" height="240" rx="16" fill="#FFFFFF" stroke="#E1E4E8" stroke-width="1.5"/>
  <g transform="translate(220,635) scale(0.5)">
    <path d="M0,-115 L-80,-65 L-80,25 L0,115 Z" fill="#0E2A47"/>
    <path d="M0,-115 L80,-65 L80,25 L0,115 Z" fill="#14C9B7"/>
    <circle cx="0" cy="0" r="34" fill="#FFFFFF" stroke="#0E2A47" stroke-width="2"/>
    <path d="M0,-14 L14,0 L0,14 L-14,0 Z" fill="#D9A441"/>
  </g>
  <text x="220" y="740" text-anchor="middle" font-size="13" letter-spacing="2" fill="#6B7684" font-weight="700">ON LIGHT</text>

  <!-- Card 2: On dark -->
  <rect x="400" y="540" width="280" height="240" rx="16" fill="#0E2A47"/>
  <g transform="translate(540,635) scale(0.5)">
    <path d="M0,-115 L-80,-65 L-80,25 L0,115 Z" fill="#123350"/>
    <path d="M0,-115 L80,-65 L80,25 L0,115 Z" fill="#14C9B7"/>
    <circle cx="0" cy="0" r="34" fill="#FFFFFF" stroke="#0E2A47" stroke-width="2"/>
    <path d="M0,-14 L14,0 L0,14 L-14,0 Z" fill="#D9A441"/>
  </g>
  <text x="540" y="740" text-anchor="middle" font-size="13" letter-spacing="2" fill="#9FB0C3" font-weight="700">ON DARK</text>

  <!-- Card 3: Monochrome -->
  <rect x="720" y="540" width="280" height="240" rx="16" fill="#FFFFFF" stroke="#E1E4E8" stroke-width="1.5"/>
  <g transform="translate(860,635) scale(0.5)">
    <path d="M0,-115 L-80,-65 L-80,25 L0,115 Z" fill="#1A2530"/>
    <path d="M0,-115 L80,-65 L80,25 L0,115 Z" fill="#1A2530"/>
    <circle cx="0" cy="0" r="34" fill="#FFFFFF" stroke="#1A2530" stroke-width="2"/>
    <path d="M0,-14 L14,0 L0,14 L-14,0 Z" fill="#1A2530"/>
  </g>
  <text x="860" y="740" text-anchor="middle" font-size="13" letter-spacing="2" fill="#6B7684" font-weight="700">MONOCHROME</text>

  <!-- Card 4: Horizontal lockup -->
  <rect x="1040" y="540" width="280" height="240" rx="16" fill="#FFFFFF" stroke="#E1E4E8" stroke-width="1.5"/>
  <g transform="translate(1115,635) scale(0.34)">
    <path d="M0,-115 L-80,-65 L-80,25 L0,115 Z" fill="#0E2A47"/>
    <path d="M0,-115 L80,-65 L80,25 L0,115 Z" fill="#14C9B7"/>
    <circle cx="0" cy="0" r="34" fill="#FFFFFF" stroke="#0E2A47" stroke-width="2"/>
    <path d="M0,-14 L14,0 L0,14 L-14,0 Z" fill="#D9A441"/>
  </g>
  <text x="1152" y="628" font-size="17" font-weight="700" letter-spacing="0.5"><tspan fill="#0E2A47">FISCAL</tspan><tspan fill="#14C9B7">SENTRY</tspan></text>
  <text x="1152" y="645" font-size="9" letter-spacing="1.5" fill="#9AA5B1" font-weight="600">FINANCIAL AGENT</text>
  <text x="1180" y="740" text-anchor="middle" font-size="13" letter-spacing="2" fill="#6B7684" font-weight="700">APP LOCKUP</text>

  <!-- Palette -->
  <rect x="463" y="850" width="24" height="24" rx="6" fill="#0E2A47"/>
  <text x="497" y="867" font-size="13" letter-spacing="1" fill="#1A2530" font-weight="700">NAVY #0E2A47</text>

  <rect x="638" y="850" width="24" height="24" rx="6" fill="#14C9B7"/>
  <text x="672" y="867" font-size="13" letter-spacing="1" fill="#1A2530" font-weight="700">TEAL #14C9B7</text>

  <rect x="813" y="850" width="24" height="24" rx="6" fill="#D9A441"/>
  <text x="847" y="867" font-size="13" letter-spacing="1" fill="#1A2530" font-weight="700">GOLD #D9A441</text>

  <text x="700" y="925" text-anchor="middle" font-size="13" fill="#8A94A1" font-style="italic">Mirrored geometry across one vertical axis — no asymmetry, no exceptions.</text>
  <text x="700" y="950" text-anchor="middle" font-size="12" letter-spacing="1" fill="#9AA5B1">MINIMUM SIZE 24PX  ·  CLEAR SPACE 0.5× MARK HEIGHT ON ALL SIDES</text>
</svg>
